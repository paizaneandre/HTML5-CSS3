<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>treinando flexbox</title>
<style>
    main {
        width: 90vw;
        border: 1px solid rgba(94, 90, 90, 0.483);
        margin: auto;
        height: 85vh;
    }
    .conteiner-principal {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        
    }
     .barra{
        display: flex;
        flex-flow: row nowrap;
        background-color: black;
        gap: 1rem;
    
    }

    .itens {
       
        color: white;
        height: 40px;
        display: flex;
        flex-direction: row;
        justify-content: flex-start;
        align-items: center;
        padding: 10px;

    }
    .itens#login {
        margin-left: auto;
    }

    .box {
        display: flex;
        flex-direction: row;
        gap: 1rem;
        width: 98%;
        margin: 0 auto;

    }
    .caixa {
        height: 200px;
        width: 98%;
        background-color: lightgrey;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 5px 5px 5px rgba(0, 0, 0, 0.47);
    }
</style>
</head>
<body>
    <main>
        <section class="conteiner-principal">
            <section class="barra">
                <article class="itens">Inicio</article>
                <article class="itens">Series</article>
                <article class="itens">Filmes</article>
                <article class="itens">Documentos</article>
                <article class="itens" id="login"> Login</article>
            </section>

            <section class="box">
                    <article class="caixa">caixa A</article>
                    <article class="caixa">caixa B</article>
                </section>
                    <section class="box">
                        <article class="caixa">caixa C</article>
                        <article class="caixa">caixa D</article>
                    </section>
            
                
        </section>
    </main>
    
</body>
</html>
