<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid05</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: 100px 100px 100px 100px;
            grid-template-rows: 60px 60px 60px;
            gap: 10px;
            grid-auto-flow: row dense;
            
        }
         .item {
            display: grid;
             background-color: darkgray;
             border: 2px solid black;
             justify-content: center;
             align-content: center;
             border-radius: 5px;
             
        }

         #Box2 {
            background-color: black;
            color: white;
            grid-column: auto/span 2;
        }

        #Box3 {
            background-color: black;
            color: white;
            grid-area: auto/1/auto/3;
        }


    </style>
</head>
<body>
    <h1> Aprendendo a funcao DENSE</h1>
    <P> esta funcao serve para trapar os espacos vazios dentro de uma grid, ou seja celula sem nenhum item. mas para sua aplicacao usa-se juntamente com a declaracao: grid-auto-flow: row dense (aplicando no conteiner) </P>
    
        <div class="container">
            
                <div class="item" id="Box1">Box1</div>
                <div class="item" id="Box2">Box2</div>
                <div class="item" id="Box3">Box3</div>
                <div class="item" id="Box4">Box4</div>
                <div class="item" id="Box5">Box5</div>
                <div class="item" id="Box6">Box6</div>
            
        </div>
    
</body>
</html>
