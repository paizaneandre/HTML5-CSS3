<html lang="pt'br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario02</title>
</head>
<form action="cadastro.php" method="get" autocomplete="on">
    <p>Exemplo de formulario</p>
    <p>
        <label for="iname">Name:</label>
        <input type="text" name="name" id="iname" placeholder="nome completo" autocomplete="name">
    </p>
    <p><label for="imedia"> Media:</label>
        <input type="number" name="media" id="imedia" min="0" max="10" step="0.5" placeholder="0 a 10" value="5">
    </p>
    <p>
        <label for="imes"> Mes: </label>
        <input type="month" name="mes" id="imes" value="2025-07">
    </p>
    <p>
        <label for="idia">Dia da avaliacao: </label>
        <input type="date" name="dia" id="idia">
    </p>
    
   <input type="submit" value="Enviar">
    <input type="reset" value="Limpar">
</form>
