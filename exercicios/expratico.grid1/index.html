<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercicio pratico</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet">

    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        .container {
            display: grid;
            grid-template-columns:200px minmax(200px, 1fr);
            grid-template-rows: 50px minmax(200px, auto) 50px;
            max-width: 90vw;
            margin: auto;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.494);
            
        }
       
        header {
            display: flex;
            background-color:rgb(250, 2, 122);
            grid-area: 1/1/2/3;
            justify-content: center; 
            align-items: center;   
        }

        header > p {
            display: flex;
            height: 20px;
            color: black;
            padding: 5px;
            margin: 0px 10px;
            padding: 5px 0px;
            font-weight: bold;
        }
        
        header > p > span{
            transform: translateY(-7px);
            margin-right: 10px;
        }

        header > button  {
            height: 20px;
            padding: 0px 10px;
            margin-left: auto;
            margin-right: 20px;
          
        }

        header > button:hover {
            background-color: white;
            cursor: pointer;
        }
        nav {
            background-color:pink;
            grid-area: 2/1/3/2;
        }
        nav > div> ul {
            list-style: none;
            margin: 10px;
            
        }
        nav > div > ul > li {
            line-height: 1.5em;
            position: relative;
            
        }
        nav > div > ul > li > span {
            display: inline-block;
            transform: translateY(4px);
            color: black;
            font-size: 1.5em;
            margin-right: 10px;
        }
        nav > div> ul > li span:nth-of-type(1) {
            background-color: gray;
            color: white;
        }
        nav > div > ul > li span:nth-of-type(2) {
            position: absolute;
            left: 90%;
        }

        
        main {
        
            grid-area: 2/2/3/3;
        }
        footer {
            display: grid;
            background-color:rgb(250, 2, 122);
            grid-area: 3/1/4/3;
            text-align: center;
            place-items: center;
        }

        footer > p > span {
            transform: translateY(6px);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
                <p><span class="material-icons">cake</span>Confeitaria</p> 
                <button>Login</button>
        </header>
        <nav>
            <div>
                <ul>
                <li> <span class="material-icons">home</span>Home<span class="material-icons">chevron_right</span></li>
                <li> <span class="material-icons">motorcycle</span>Produtos <span class="material-icons">chevron_right</span></li>
                <li> <span class="material-icons">shopping_cart</span>Carrinho <span class="material-icons">chevron_right</span></li>
                <li> <span class="material-icons">person</span>Perfil <span class="material-icons">chevron_right</span></li>
            </ul>
        </div>
        </nav>
        <main>
            <p>main principal</p>
        </main>
        <footer>
            <p>Bolos deliciosos feito com muito carinho  <span class="material-icons">favorite</span></p>
        </footer>
        
    </div>
</body>
</html>
