<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercicio pratico</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }
        .container {
            display: grid;
            grid-template-columns:200px minmax(200px, 1fr);
            grid-template-rows: 50px minmax(200px, auto) 50px;
            max-width: 90vw;
            margin: auto;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.494);
            
        }
       
        .header {
            display: flex;
            flex-direction: row;
            background-color:pink;
            grid-area: 1/1/2/3; 
            justify-content: center; 
            align-items: center; 
        }

        .header > button  {
            padding: 0px 10px;
            margin-left: auto;
            margin-right: 20px;
            align-items: center;    
        }

        .header > button:hover {
            background-color: white;
            cursor: pointer;
        }
        .menu {
            background-color:red;
            grid-area: 2/1/3/2;
        }
        .menu > ul {
            list-style: none;
            margin: 10px;
        }
        .menu > ul > li {
            line-height: 1.5em;
        }
        .main {
            background-color: blue;
            grid-area: 2/2/3/3;
        }
        .footer {
            background-color: palevioletred;
            grid-area: 3/1/4/3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><p>Confeitaria</p> <button>Login</button></div>
        <div class="menu" ><ul>
            <li>Home</li>
            <li>Produtos</li>
            <li>Carrinho</li>
            <li>Perfil</li>
        </ul></div>
        <div class="main">main</div>
        <div class="footer">footer</div>
        
    </div>
</body>
</html>
