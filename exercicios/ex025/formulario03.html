<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario03</title>
</head>
<body>
    <h1>exemplo de formularios</h1>
    <form action="cadastro.php" method="get">
        <fieldset>
            <legend>Dados pessoais</legend>
            <p><label for="inome">Nome: </label>
                <input type="text" name="nome" id="inome">
            </p>
            <p><label for="imail"> email: </label>
                <input type="email" name="email" id="imail">
            </p>
            <p><label for="itel"> telefone:</label>
                <input type="tel" name="tel" id="itel">
            </p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </fieldset>
    </form>
    
</body>
</html>
